# semantic-release via a single workflow file (required by npm Trusted Publishing:
# each package allows only ONE trusted publisher / workflow filename — see
# https://docs.npmjs.com/trusted-publishers).
#
# Branch behaviour (.releaserc.json):
#   main → stable semver, npm dist-tag `latest`, GitHub Release
#   beta → preview pre-release `{nextStable}-beta.N`, npm dist-tag `beta`
name: Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: npm ≥ 11.5.1 (trusted publishing / OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (excludes live.*)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Publish gate (skip until npm publishing is enabled)
        if: ${{ vars.NPM_PUBLISHING_ENABLED != 'true' }}
        run: |
          echo "::notice title=Release skipped::NPM_PUBLISHING_ENABLED is not 'true'."
          echo "Configure npm Trusted Publishing (workflow filename: release.yml), then:"
          echo "  gh variable set NPM_PUBLISHING_ENABLED --body \"true\""

      - name: Install semantic-release (not root devDependencies)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/npm@13 \
            @semantic-release/github@12

      - name: Semantic release
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
