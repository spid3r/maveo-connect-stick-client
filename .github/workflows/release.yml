# semantic-release: main → npm latest + GitHub Release; beta → prerelease + npm dist-tag beta.
# Prefer npm Trusted Publishing (OIDC). Optional NPM_TOKEN repo secret while migrating.
name: Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: npm ≥ 11.5.1 (trusted publishing / OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (excludes live.*)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # ---------------------------------------------------------------------------
      # Publish gate.
      #
      # The CI build above (typecheck / unit tests / build) ALWAYS runs on every
      # push to main / beta. The actual semantic-release publish step is gated:
      #
      #   * Until you have done your first publish manually with `npm run
      #     release:local` AND configured npm Trusted Publishing on npmjs.com,
      #     leave the repo variable `NPM_PUBLISHING_ENABLED` unset (or != "true").
      #     The workflow then stops here with a friendly notice — green CI, no
      #     accidental failed publishes.
      #
      #   * Once the package exists on npmjs.com and Trusted Publishing is wired
      #     up for this repo + workflow, set the variable:
      #         gh variable set NPM_PUBLISHING_ENABLED --body "true"
      #     From then on every push to main / beta will publish via OIDC
      #     (no long-lived NPM_TOKEN required).
      #
      #   * Fallback: if you ever need to publish without Trusted Publishing,
      #     also set the `NPM_TOKEN` repo secret. semantic-release will use it
      #     when OIDC is unavailable.
      # ---------------------------------------------------------------------------
      - name: Publish gate (skip until npm publishing is enabled)
        if: ${{ vars.NPM_PUBLISHING_ENABLED != 'true' }}
        run: |
          echo "::notice title=Release skipped::NPM_PUBLISHING_ENABLED is not 'true'."
          echo "Run \`npm run release:local\` for the first publish, configure npm"
          echo "Trusted Publishing for this repo + workflow, then set the repo"
          echo "variable: gh variable set NPM_PUBLISHING_ENABLED --body \"true\""

      - name: Install semantic-release (not root devDependencies)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/npm@13 \
            @semantic-release/github@12

      - name: Semantic release
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
