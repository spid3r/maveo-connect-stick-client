# Stable releases on `main` only: semver, CHANGELOG, npm `latest`, GitHub Release.
#
# Pre-releases on `beta` → see workflow `beta-release.yml` (semantic-release
# pre-release branch; preview versions like 1.2.0-beta.1 while stable is 1.1.0).
#
# Prefer npm Trusted Publishing (OIDC). Optional NPM_TOKEN repo secret while migrating.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: npm ≥ 11.5.1 (trusted publishing / OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (excludes live.*)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Publish gate (skip until npm publishing is enabled)
        if: ${{ vars.NPM_PUBLISHING_ENABLED != 'true' }}
        run: |
          echo "::notice title=Release skipped::NPM_PUBLISHING_ENABLED is not 'true'."
          echo "Configure npm Trusted Publishing for this repo + workflow, then:"
          echo "  gh variable set NPM_PUBLISHING_ENABLED --body \"true\""

      - name: Install semantic-release (not root devDependencies)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/npm@13 \
            @semantic-release/github@12

      - name: Semantic release (stable → npm latest)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
