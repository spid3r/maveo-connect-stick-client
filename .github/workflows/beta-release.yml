# Pre-releases on `beta`: semantic-release pre-release branch (see .releaserc.json).
#
# Topic branches (fix/*, feature/*) merge to `beta` via PR; only `beta` publishes
# npm pre-releases with dist-tag `beta`. Version is a **preview** of the upcoming
# stable line (e.g. 1.2.0-beta.1 while stable is 1.1.0 after a feat: on beta).
#
# Register this workflow filename on npmjs Trusted Publishing alongside release.yml.
name: Beta release

on:
  push:
    branches: [beta]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release-beta
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: npm ≥ 11.5.1 (trusted publishing / OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (excludes live.*)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Publish gate (skip until npm publishing is enabled)
        if: ${{ vars.NPM_PUBLISHING_ENABLED != 'true' }}
        run: |
          echo "::notice title=Beta release skipped::NPM_PUBLISHING_ENABLED is not 'true'."
          echo "Configure npm Trusted Publishing for beta-release.yml, then:"
          echo "  gh variable set NPM_PUBLISHING_ENABLED --body \"true\""

      - name: Install semantic-release (not root devDependencies)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/npm@13 \
            @semantic-release/github@12

      - name: Semantic release (pre-release → npm dist-tag beta)
        if: ${{ vars.NPM_PUBLISHING_ENABLED == 'true' }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
